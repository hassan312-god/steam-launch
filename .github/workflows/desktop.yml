name: Application de bureau

# Construit les installateurs Windows, macOS et Linux.
# Lancer à la main (Actions → Application de bureau → Run workflow) ou en poussant un tag « v1.0.0 ».
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/**'] # construit aussi à chaque modification de l'application de bureau sur cette branche
    paths: ['desktop/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']

jobs:
  # Numéro de version : « v1.2.3 » pour un tag, sinon 0.2.<numéro du run> (toujours croissant, sans commit).
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        # Sur un simple push de branche : Windows uniquement (plus rapide). Lancement manuel ou tag : les trois systèmes.
        os: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && fromJSON('["windows-latest"]') || fromJSON('["windows-latest","macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire l'installateur
        shell: bash
        run: npx electron-builder --publish never "-c.extraMetadata.version=${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ga-launcher-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error

  # Publie les installateurs dans une Release publique (le dépôt est public : le site peut les proposer au téléchargement).
  # Chaque build publie une Release « vX.Y.Z » (la dernière devient « latest ») avec les fichiers de mise à jour automatique (latest*.yml).
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: G.A Launcher ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
