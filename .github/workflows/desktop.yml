name: Application de bureau

# Construit les installateurs Windows, macOS et Linux.
# Lancer à la main (Actions → Application de bureau → Run workflow) ou en poussant un tag « v1.0.0 ».
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/**'] # construit aussi à chaque modification de l'application de bureau sur cette branche
    paths: ['desktop/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Sur un simple push de branche : Windows uniquement (plus rapide). Lancement manuel ou tag : les trois systèmes.
        os: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && fromJSON('["windows-latest"]') || fromJSON('["windows-latest","macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ga-launcher-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
