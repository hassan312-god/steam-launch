<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>G.A Launcher</title>
<body style="margin:0;height:100vh;display:grid;place-items:center;background:#06060A;color:#fff;font:16px system-ui;text-align:center">
<main><h1 style="font-size:28px;margin:0 0 8px">Pas de connexion</h1>
<p style="color:#C8C9D2;margin:0 0 24px">Impossible de joindre le launcher. Vérifie ta connexion Internet.</p>
<button id="r" style="height:48px;padding:0 28px;border:0;border-radius:24px;background:#B6FF3D;color:#06060A;font-weight:800;font-size:16px;cursor:pointer">Réessayer</button></main>
<script>document.getElementById('r').onclick=()=>{location.href=new URLSearchParams(location.search).get('retry')}</script></body></html>
